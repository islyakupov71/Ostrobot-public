name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # РўРёРїС‹ РїСЂРѕРІРµСЂСЏСЋС‚СЃСЏ СЂР°РЅСЊС€Рµ СЃР±РѕСЂРєРё: РѕС€РёР±РєР° С‚РёРїР° РЅР°С…РѕРґРёС‚СЃСЏ Р·Р° СЃРµРєСѓРЅРґС‹,
      # Р° РїР°РґРµРЅРёРµ СЃР±РѕСЂРєРё РїРѕ С‚РѕР№ Р¶Рµ РїСЂРёС‡РёРЅРµ вЂ” Р·Р° РјРёРЅСѓС‚С‹.
      - name: РџСЂРѕРІРµСЂРєР° С‚РёРїРѕРІ
        run: pnpm -r typecheck

      - name: РЎР±РѕСЂРєР°
        run: pnpm build:all
